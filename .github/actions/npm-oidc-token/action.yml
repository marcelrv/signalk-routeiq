name: npm OIDC token
description: >
  Exchange this job's GitHub OIDC token for a short-lived npm credential and
  expose it to later steps as NODE_AUTH_TOKEN.

  Needed because npm's trusted publishing is wired into `npm publish` only — as
  of npm 12, lib/utils/oidc.js is required from lib/commands/publish.js and
  nowhere else — so commands like `npm dist-tag` send no credential and answer
  401. This performs the same two-step exchange the CLI does internally.

  The caller's job must set `permissions: id-token: write`, must have already
  checked out the repository (the package name is read from package.json), and
  must run in a workflow whose filename matches the Trusted Publisher configured
  on npmjs.com — the id_token's job_workflow_ref claim is validated against it.

runs:
  using: composite
  steps:
    - name: Exchange the GitHub OIDC token for an npm credential
      shell: bash
      run: |
        set -euo pipefail

        # npa()'s escapedName: scoped names encode the separator, plain ones pass through
        PKG_ESCAPED="$(node -p "require('./package.json').name.replace('/', '%2f')")"

        ID_TOKEN="$(curl -sS \
          -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" \
          | jq -r '.value // empty')"
        if [ -z "$ID_TOKEN" ]; then
          echo "Could not obtain a GitHub OIDC id_token — is 'permissions: id-token: write' set on this job?"
          exit 1
        fi

        NPM_TOKEN="$(curl -sS -X POST \
          -H "Authorization: Bearer $ID_TOKEN" \
          "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/$PKG_ESCAPED" \
          | jq -r '.token // empty')"
        if [ -z "$NPM_TOKEN" ]; then
          echo "npm rejected the token exchange. The Trusted Publisher for this package"
          echo "must name this repository AND this workflow's filename on npmjs.com."
          exit 1
        fi

        echo "::add-mask::$NPM_TOKEN"
        echo "NODE_AUTH_TOKEN=$NPM_TOKEN" >> "$GITHUB_ENV"
        echo "Exchanged the OIDC token for an npm credential."

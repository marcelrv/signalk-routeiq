name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # The shared Signal K reusable workflow is what the App Store registry
  # credits — a hand-rolled equivalent scores the -10 "no plugin-CI workflow"
  # penalty. The penalty only clears once a run referencing this workflow
  # exists on the exact commit SHA published to npm, so commit this before
  # bumping the version.
  #
  # armv7 (Cerbo GX) is off because that leg runs Node 20, which cannot run
  # this plugin at all: node:sqlite does not exist there and
  # --experimental-sqlite is rejected outright as a bad option. package.json
  # already declares engines >= 22.5.0.
  #
  # Note if format:check ever fails right after running `npm run format`:
  # prettier is not always idempotent in a single pass — nested calls like
  # res.status().json() can reflow on a second pass. Re-run `npm run format`
  # until `npm run format:check` is clean.
  test:
    uses: SignalK/signalk-server/.github/workflows/plugin-ci.yml@master
    with:
      enable-armv7: false
      format-check-command: 'npm run format:check'

  # Not part of the reusable workflow — it takes test/build/format commands
  # but has no lint input, and a job that `uses:` a reusable workflow cannot
  # also declare steps. So lint runs as a sibling job.
  #
  # Errors fail the build, warnings do not. There is a backlog of
  # no-explicit-any / no-unused-vars warnings; add --max-warnings once that
  # is cleared, to stop it growing again.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Not engines' 22.5.0. npm 10.8.2, which ships with that exact release,
      # dies with "Exit handler never called!" while installing the current dev
      # tree — and it exits 0 while doing it, so `npm ci` looks like it passed
      # and the next step fails with `eslint: not found`. Reproducible: node
      # 22.5.0 crashes, node 22 latest and 24 install the same lockfile fine.
      # This job lints, it does not exercise the runtime floor — the test matrix
      # does that on 22 and 24.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - run: npm run lint

  # Also not part of the reusable workflow, and also a sibling job for the same
  # reason lint is: no input for it and no steps alongside a `uses:`. Protects
  # this release's headline guarantees — booting on a browser without
  # AbortSignal.timeout, booting fully offline, naming a missing vendored file
  # or a missing app.js on the loading overlay instead of hanging silently, and
  # no external/CDN asset creeping back into index.html — none of which is
  # exercised anywhere else in this workflow. It needs no SignalK server: the
  # script serves public/ itself, so there is nothing here for the reusable
  # workflow's server-backed test job to share.
  #
  # Runs inside the Playwright image itself (same tag test/ui/README.md
  # documents for the local invocation) so the browsers are already on disk;
  # PLAYWRIGHT_BROWSERS_PATH points at where the image put them.
  boot-guard:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.54.0-noble
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4

      # npm init -y first, deliberately: test/ui has no package.json of its
      # own (see README.md), and without one to anchor it `npm install` walks
      # up to the repo root's and installs the dependency there instead —
      # silently, and it rewrites the whole file when it does.
      - run: npm init -y && npm install playwright@1.54.0 --no-audit --no-fund
        working-directory: test/ui

      - run: node test/ui/boot-guard.mjs
        env:
          PUBLIC_DIR: ${{ github.workspace }}/public

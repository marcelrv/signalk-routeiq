# Publishes to npm whenever a GitHub Release is published. Expects the
# release's tag (e.g. "v0.1.0-alpha.1") to match package.json's version —
# bump package.json (and CHANGELOG.md) in a normal commit first, merge it,
# THEN create the matching GitHub Release; this workflow refuses to publish
# if the two disagree, so a stale tag can't accidentally ship the wrong code.
#
# Publishes under the npm dist-tag matching the version's pre-release
# identifier (e.g. 0.1.0-alpha.1 -> "alpha"). Versions with no pre-release
# identifier publish as "latest" as usual.
#
# While no stable version exists yet, the pre-release ALSO becomes "latest" —
# see the "Point latest at this pre-release" step. Without that, `npm install
# signalk-routeiq` resolves to nothing useful (or to a stale build left behind
# by an earlier manual publish), and the Signal K App Store reads these tags.
# Once a stable version is out, pre-releases stop touching "latest", so a plain
# install is never dragged onto an alpha.
#
# The workflow_dispatch trigger can repoint a dist-tag at an already-published
# version by hand. It has to live in THIS file: npm validates the OIDC token's
# job_workflow_ref against the Trusted Publisher configured on npmjs.com, which
# names this filename, so a separate workflow would be rejected at the exchange.
#
# Uses npm Trusted Publishing (OIDC) — no NPM_TOKEN secret at all. One-time
# setup on npmjs.com, AFTER the package has been published at least once
# (trusted publishing is configured on the existing package's settings page,
# so the very first release of a brand-new package name must be published
# manually with `npm publish`/`npm login`): package page → Settings →
# "Trusted Publisher" → Add GitHub Actions publisher, with:
#   Organization or user: <the GitHub owner, e.g. marcelrv>
#   Repository:            signalk-routeiq
#   Workflow filename:     publish-npm.yml   (must match this file's name exactly)
#   Environment:           (leave blank unless you add one below)
# `permissions: id-token: write` below is what lets npm CLI exchange this
# job's OIDC token for a short-lived publish credential automatically.

name: Publish to npm

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      version:
        description: 'Already-published version to point a tag at, e.g. 0.1.0-alpha.3'
        required: true
      # Underscore, not a hyphen: GitHub expressions cannot reach a hyphenated
      # name with dot notation — `inputs.dist-tag` parses as a subtraction.
      dist_tag:
        description: 'dist-tag to move (latest, alpha, next, …)'
        required: true
        default: latest

jobs:
  publish:
    # Only a release publishes; a manual dispatch just moves a tag.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for OIDC trusted publishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs a recent npm CLI (11.5.1+) — newer than
      # what Node 22's bundled npm may ship, so upgrade explicitly rather
      # than depending on whatever setup-node happened to install.
      - run: npm install -g npm@latest

      - name: Verify package.json version matches the release tag
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          TAG="${{ github.event.release.tag_name }}"
          if [ "$PKG_VERSION" != "$TAG" ]; then
            echo "package.json version ($PKG_VERSION) does not match release tag ($TAG) — bump package.json first."
            exit 1
          fi

      - name: Determine npm dist-tag from version pre-release identifier
        id: dist-tag
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          PRERELEASE_ID="$(node -p "(require('./package.json').version.match(/-([a-zA-Z]+)/) || [])[1] || ''")"
          TAG="${PRERELEASE_ID:-latest}"
          echo "Publishing $VERSION under dist-tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npm run build

      - name: Run tests
        run: npm test
        env:
          NODE_OPTIONS: --experimental-sqlite

      - run: npm publish --provenance --access public --tag ${{ steps.dist-tag.outputs.tag }}

      # `npm publish --tag alpha` does not move `latest`, so during the
      # pre-stable phase `latest` would sit on whatever was published first (or
      # nothing at all) and every release would silently drift further from it.
      # Moving it needs its own credential — see the composite action.
      - name: Get an npm credential for the dist-tag write
        if: steps.dist-tag.outputs.tag != 'latest'
        uses: ./.github/actions/npm-oidc-token

      - name: Point latest at this pre-release while no stable version exists
        if: steps.dist-tag.outputs.tag != 'latest'
        run: |
          set -euo pipefail
          PKG="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"

          # A stable version is any published version with no pre-release part.
          HAS_STABLE="$(npm view "$PKG" versions --json | node -e "
            let d = '';
            process.stdin.on('data', (c) => (d += c)).on('end', () => {
              const raw = JSON.parse(d);
              const all = Array.isArray(raw) ? raw : [raw];
              console.log(all.some((v) => !v.includes('-')) ? 'yes' : 'no');
            });
          ")"

          if [ "$HAS_STABLE" = "yes" ]; then
            echo "A stable version is published, so leaving 'latest' alone —"
            echo "a plain 'npm install $PKG' must not resolve to a pre-release."
          else
            echo "No stable version yet, so 'latest' tracks this pre-release."
            npm dist-tag add "$PKG@$VERSION" latest
          fi
          npm dist-tag ls "$PKG"

  # Repoint a dist-tag at an already-published version, for the cases the
  # release path cannot cover on its own: a version published before this
  # automation existed, or promoting/demoting a tag after the fact.
  move-dist-tag:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required to request the OIDC id_token
    steps:
      - uses: actions/checkout@v4

      - name: Check the version is actually published
        run: |
          set -euo pipefail
          PKG_ESCAPED="$(node -p "require('./package.json').name.replace('/', '%2f')")"
          # Plain HTTP rather than `npm view`, which at this point would run
          # against setup-node's .npmrc while NODE_AUTH_TOKEN is still unset and
          # can fail on the empty credential instead of the real question.
          if ! curl -sSf "https://registry.npmjs.org/$PKG_ESCAPED" \
            | jq -e --arg v '${{ inputs.version }}' '.versions[$v]' > /dev/null; then
            echo "Version ${{ inputs.version }} is not published — nothing to tag."
            exit 1
          fi
          echo "Found ${{ inputs.version }}"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          # Writes an .npmrc referencing NODE_AUTH_TOKEN, which the next step sets
          registry-url: 'https://registry.npmjs.org'

      - uses: ./.github/actions/npm-oidc-token

      - name: Move the dist-tag
        run: |
          set -euo pipefail
          PKG="$(node -p "require('./package.json').name")"
          npm dist-tag add "$PKG@${{ inputs.version }}" '${{ inputs.dist_tag }}'
          npm dist-tag ls "$PKG"

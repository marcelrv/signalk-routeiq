services:
  signalk-server:
    image: signalk/signalk-server:latest
    container_name: signalk-server
    networks:
      - home
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/node/.signalk:/home/node/.signalk
      - /usr/bin/docker:/usr/bin/docker:ro
      # Mount dev dir at a non-node_modules path so npm can create a managed
      # file: symlink from node_modules/signalk-routeiq → ../routeiq-dev.
      # npm preserves file: symlinks during its install tree operations.
      - /home/node/signalkdev/signalk-routeiq:/home/node/.signalk/routeiq-dev
    environment:
      - TZ=Europe/Amsterdam
      - SIGNALK_CONTAINER_ID=signalk-server
    working_dir: /home/node/.signalk
    user: node
    entrypoint: /home/node/signalk/startup.sh

networks:
  home:
    external: true
